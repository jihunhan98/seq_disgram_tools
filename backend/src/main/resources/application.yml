# ---------------------------------------------------------------------------
# Committed configuration ONLY.
# Every secret (Oracle DB credentials, in-house AI endpoint) is supplied by
# config/application-local.yml, which is git-ignored.
# See config/application-local.yml.example for the template.
# ---------------------------------------------------------------------------
server:
  port: 5000
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: seq-diagram-backend

  # Loaded from the repository-root ./config directory. Both paths are tried so
  # the app can be started either from the repository root or from ./backend.
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:../config/application-local.yml

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: seq-diagram-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000
      connection-test-query: SELECT 1 FROM DUAL

  mvc:
    problemdetails:
      enabled: false

  jackson:
    default-property-inclusion: non_null

app:
  # Origins allowed to call this API. The static frontend is served on :5001.
  cors:
    allowed-origins: http://localhost:5001,http://127.0.0.1:5001
  db:
    # Creates MEMBER, MEMBER_SESSION and SEQ_DIAGRAM on startup when missing.
    auto-init: true
  auth:
    # How long a login token stays valid.
    session-hours: 12
  ai:
    # AI 서버(ai-model, FastAPI). ./run-ai.sh 로 띄운다.
    # 사내 LLM API 주소·모델명은 여기가 아니라 ai-model/.env 에 있다.
    base-url: ${AI_BASE_URL:http://localhost:5002}
    # 생성에 시간이 걸리므로 넉넉히 잡는다.
    timeout-seconds: 150

logging:
  level:
    com.company.seqdiagram: INFO
