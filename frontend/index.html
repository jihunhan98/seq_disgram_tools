<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram Tool</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="app-header">
    <div class="brand">
        <span class="brand-mark">SD</span>
        <div>
            <h1>Sequence Diagram Tool</h1>
            <p>자연어로 만들고, Mermaid로 다듬고, Oracle DB에 보관합니다.</p>
        </div>
    </div>
    <div class="header-status">
        <span id="ai-status" class="status-pill status-pill--unknown">AI 상태 확인 중</span>
        <button id="btn-new" class="btn btn-ghost" type="button">+ 새 다이어그램</button>
    </div>
</header>

<main class="layout">
    <!-- ------------------------------------------------------------------ -->
    <!-- Saved diagrams                                                      -->
    <!-- ------------------------------------------------------------------ -->
    <aside class="sidebar">
        <div class="sidebar-head">
            <h2>저장된 다이어그램</h2>
            <button id="btn-reload" class="btn btn-icon" type="button" title="목록 새로고침">⟳</button>
        </div>
        <input id="search" class="input" type="search" placeholder="제목으로 검색" autocomplete="off">
        <ul id="diagram-list" class="diagram-list"></ul>
        <p id="list-empty" class="muted small">저장된 다이어그램이 없습니다.</p>
    </aside>

    <section class="content">
        <!-- -------------------------------------------------------------- -->
        <!-- Metadata                                                        -->
        <!-- -------------------------------------------------------------- -->
        <div class="card">
            <div class="meta-row">
                <label class="field field--grow">
                    <span class="field-label">제목 <em>*</em></span>
                    <input id="title" class="input" type="text" maxlength="200"
                           placeholder="예) 결제 승인 시퀀스">
                </label>
                <label class="field field--grow">
                    <span class="field-label">설명</span>
                    <input id="description" class="input" type="text" maxlength="2000"
                           placeholder="예) Design Review 2026-09 회차 검토용">
                </label>
            </div>
            <div class="meta-row meta-row--actions">
                <span id="doc-state" class="muted small">저장되지 않은 새 다이어그램입니다.</span>
                <div class="button-group">
                    <button id="btn-delete" class="btn btn-danger" type="button" disabled>삭제</button>
                    <button id="btn-save" class="btn btn-primary" type="button">저장</button>
                </div>
            </div>
        </div>

        <!-- -------------------------------------------------------------- -->
        <!-- Natural language -> Mermaid                                     -->
        <!-- -------------------------------------------------------------- -->
        <div class="card">
            <div class="card-head">
                <h2>자연어 요청</h2>
                <div class="segmented" role="tablist">
                    <button id="tab-generate" class="segment is-active" type="button" role="tab">새로 생성</button>
                    <button id="tab-refine" class="segment" type="button" role="tab">수정 반영</button>
                </div>
            </div>
            <p id="prompt-help" class="muted small">
                그리고 싶은 흐름을 문장으로 설명하면 AI가 Mermaid 시퀀스 다이어그램으로 만들어 줍니다.
            </p>
            <textarea id="prompt" class="textarea textarea--prompt" rows="4"
                      placeholder="예) 사용자가 로그인하면 API 게이트웨이가 인증 서버에 토큰을 요청하고, 성공하면 프로필 서비스에서 사용자 정보를 조회한다. 실패하면 401을 반환한다."></textarea>
            <div class="card-actions">
                <span id="ai-hint" class="muted small"></span>
                <button id="btn-run-ai" class="btn btn-primary" type="button">
                    <span class="btn-label">AI로 생성</span>
                    <span class="spinner" hidden></span>
                </button>
            </div>
        </div>

        <!-- -------------------------------------------------------------- -->
        <!-- Preview                                                         -->
        <!-- -------------------------------------------------------------- -->
        <div class="card">
            <div class="card-head">
                <h2>미리보기</h2>
                <div class="button-group">
                    <button id="btn-zoom-out" class="btn btn-icon" type="button" title="축소">−</button>
                    <span id="zoom-level" class="muted small">100%</span>
                    <button id="btn-zoom-in" class="btn btn-icon" type="button" title="확대">+</button>
                    <button id="btn-zoom-reset" class="btn btn-ghost btn-sm" type="button">100%</button>
                    <button id="btn-download-svg" class="btn btn-ghost btn-sm" type="button">SVG 저장</button>
                </div>
            </div>
            <div id="preview" class="preview"></div>
            <p id="render-error" class="error-box" hidden></p>
        </div>

        <!-- -------------------------------------------------------------- -->
        <!-- Editable Mermaid source                                         -->
        <!-- -------------------------------------------------------------- -->
        <div class="card">
            <div class="card-head">
                <h2>Mermaid 코드</h2>
                <div class="button-group">
                    <button id="btn-paste" class="btn btn-ghost btn-sm" type="button">붙여넣기</button>
                    <button id="btn-copy" class="btn btn-ghost btn-sm" type="button">복사</button>
                </div>
            </div>
            <textarea id="editor" class="textarea textarea--code" spellcheck="false"
                      placeholder="sequenceDiagram&#10;    participant User&#10;    User->>API: 요청"></textarea>
            <p class="muted small">코드를 수정하면 미리보기가 자동으로 갱신됩니다. (Tab 키로 들여쓰기)</p>
        </div>
    </section>
</main>

<div id="toast" class="toast" hidden></div>

<div id="confirm" class="modal" hidden>
    <div class="modal-box">
        <h3 id="confirm-title">확인</h3>
        <p id="confirm-message"></p>
        <div class="button-group modal-actions">
            <button id="confirm-cancel" class="btn btn-ghost" type="button">취소</button>
            <button id="confirm-ok" class="btn btn-danger" type="button">확인</button>
        </div>
    </div>
</div>

<script src="vendor/mermaid.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
